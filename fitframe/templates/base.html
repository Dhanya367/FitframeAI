<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}FitFrame AI{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<header class="nav"><div class="in"><a class="logo" href="/"><i></i>FitFrame <b>AI</b></a>
<nav><a href="/">Home</a><a href="/#how">How it works</a><a href="/history">History</a></nav>
<a class="btn sm" href="/start">Try it free</a></div></header>
{% block body %}{% endblock %}
<footer><div class="wrap"><div class="fg"><div><b>FitFrame AI</b><p>Smart body measurement and style recommendations.</p></div>
<div><b>Explore</b><a href="/start">Analyze</a><a href="/history">History</a></div>
<div><b>Built with</b><a>Python &amp; Flask</a><a>MediaPipe &amp; OpenCV</a><a>SQLite</a></div></div>
<p class="copy">&copy; FitFrame AI &middot; Design project</p></div></footer>
<script>const o=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');o.unobserve(x.target)}}),{threshold:.12});
document.querySelectorAll('.rv').forEach(el=>o.observe(el));</script></body></html>
